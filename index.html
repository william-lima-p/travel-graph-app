<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Diário de viagens</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div id="sidebar">
    <h2 class="app-title">
      <span class="pixel-planet" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img" focusable="false">
          <path
            d="M3.5 6.1 8.4 4.2l7.1 2.1 5-1.9v13.4l-5 1.9-7.1-2.1-4.9 1.9Z"
            fill="#dbeafe"
            stroke="currentColor"
            stroke-width="1.35"
            stroke-linejoin="round"
          />
          <path d="M8.4 4.2v13.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          <path d="M15.5 6.3v13.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          <path
            d="M5.8 13.6c1.3-1.9 2.8-3.1 4.5-3.5 1.7-.4 3.4 0 5.1 1.1"
            fill="none"
            stroke="#f97316"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <path
            d="M15.6 12.9c1.4-1.7 2.1-3.1 2.1-4.1a2.1 2.1 0 1 0-4.2 0c0 1 .7 2.4 2.1 4.1Z"
            fill="#fb923c"
            stroke="currentColor"
            stroke-width="1.1"
            stroke-linejoin="round"
          />
          <circle cx="15.6" cy="8.8" r="0.8" fill="#fff7ed" />
        </svg>
      </span>
      <span>Jornal de viagens</span>
    </h2>

    <div class="toolbar-row">
      <div class="overlay-stack">
        <button id="visitedOverlayToggle" class="overlay-pill" type="button" aria-pressed="false" title="Visualizar países visitados">
          <span class="overlay-pill-icon">&#128065;</span>
          <span class="overlay-pill-label">Visualizar</span>
        </button>

        <button id="visitedOverlayModeToggle" class="overlay-pill mode-pill" type="button" title="Alternar visualização entre países e regiões">
          <span class="overlay-pill-icon" aria-hidden="true"></span>
          <span class="overlay-pill-label">Países</span>
        </button>
      </div>

      <button id="themeToggle" class="overlay-pill theme-pill" type="button" aria-pressed="false" title="Alternar modo noturno">
        <span class="overlay-pill-icon">&#9790;</span>
        <span class="overlay-pill-label">Noite</span>
      </button>
    </div>

    <span id="visitedOverlayStatus" class="sr-only" aria-live="polite"></span>

    <div class="tab-row">
      <button id="tripsTabBtn" class="tab-btn active" type="button">Viagens</button>
      <button id="citiesTabBtn" class="tab-btn" type="button">Cidades</button>
    </div>

    <section id="tripsTab" class="tab-panel active">
      <section class="trip-editor">
        <button id="tripEditorToggle" class="trip-editor-toggle" type="button" aria-expanded="false">
          <span class="trip-editor-toggle-label">Nova viagem</span>
          <span id="tripEditorChevron" class="trip-editor-chevron">▸</span>
        </button>

        <div id="tripEditorBody" class="trip-editor-body">
          <p id="tripMode" class="trip-mode">Criando uma nova viagem</p>
          <p id="tripHelp" class="trip-help">Clique no mapa para adicionar pontos. Use o botao direito em um ponto para excluir.</p>

          <input id="tripName" placeholder="Nome da viagem" />

          <div class="form-row">
            <label class="field month-field">
              <span>Mês/ano</span>
              <div class="month-input-wrap">
                <input id="tripMonth" class="month-input" type="month" />
                <button class="month-picker-toggle" type="button" data-target="tripMonth" aria-label="Abrir ou fechar calendário">🗓</button>
              </div>
            </label>

            <label class="field">
              <span>Status</span>
              <select id="tripStatus">
                <option value="planned">Planejado</option>
                <option value="completed">Concluído</option>
              </select>
            </label>
          </div>

          <div class="action-row">
            <button id="newTrip" class="btn secondary">Nova viagem</button>
            <button id="saveTrip" class="btn primary">Salvar</button>
            <button id="clearGraph" class="btn danger">Limpar</button>
          </div>
        </div>
      </section>

      <div class="data-tools">
        <div class="action-row">
          <button id="importDataBtn" class="btn secondary" type="button">Importar dados</button>
          <button id="exportDataBtn" class="btn secondary" type="button">Baixar dados</button>
        </div>
        <input id="appDataFileInput" type="file" accept=".json,application/json" hidden />
        <small id="appDataStatus">Dados sincronizados com data/app-data.json</small>
      </div>

      <label class="field">
        <span>Ordenar viagens</span>
        <select id="tripSort">
          <option value="date-asc">Mais antigas</option>
          <option value="date-desc">Mais recentes</option>
          <option value="name-asc">Nome (A-Z)</option>
          <option value="status">Status</option>
        </select>
      </label>

      <ul id="tripList"></ul>
    </section>

    <section id="citiesTab" class="tab-panel">
      <section class="city-section">
        <div class="section-header">
          <h3>Cidades visitadas</h3>
          <small id="cityListStatus">Use viagens concluídas para montar a lista</small>
        </div>

        <div id="cityList" class="city-list"></div>
      </section>
    </section>
  </div>

  <div id="mapPanel">
    <div id="map"></div>
    <div id="mapLoadingOverlay" aria-hidden="true">
      <div class="map-loading-card">
        <span class="map-spinner"></span>
        <span>Carregando visualização...</span>
      </div>
    </div>
  </div>

  <div id="editTripModal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTripTitle">
      <div class="modal-header">
        <h3 id="editTripTitle">Editar viagem</h3>
        <button id="closeEditTripModal" class="icon-btn" type="button" aria-label="Fechar edição">×</button>
      </div>

      <div class="modal-body">
        <label class="field">
          <span>Nome da viagem</span>
          <input id="editTripName" placeholder="Nome da viagem" />
        </label>

        <div class="form-row">
          <label class="field month-field">
            <span>Mês/ano</span>
            <div class="month-input-wrap">
              <input id="editTripMonth" class="month-input" type="month" />
              <button class="month-picker-toggle" type="button" data-target="editTripMonth" aria-label="Abrir ou fechar calendário">🗓</button>
            </div>
          </label>

          <label class="field">
            <span>Status</span>
            <select id="editTripStatus">
              <option value="planned">Planejado</option>
              <option value="completed">Concluído</option>
            </select>
          </label>
        </div>
      </div>

      <div class="modal-actions">
        <button id="cancelEditTrip" class="btn secondary" type="button">Cancelar</button>
        <button id="saveEditTrip" class="btn primary" type="button">Salvar edição</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-editable@1.2.0/src/Leaflet.Editable.js"></script>
  <script type="module" src="/src/main.js"></script>

</body>
</html>
